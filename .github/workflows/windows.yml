name: windows

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        config:
          - { generator: "Visual Studio 17 2022",   cppstd: 11 }
          - { generator: "Visual Studio 17 2022",   cppstd: 17 }
          - { generator: "Visual Studio 17 2022",   cppstd: 20 }
        build_type: [ Debug, Release ]

    name: "${{ matrix.config.generator}} (C++${{ matrix.config.cppstd }} ${{ matrix.build_type }})"
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: pwsh
        run: |
          mkdir build
          cd build
          cmake -G "${{ matrix.config.generator }}"  -A x64 `
            -D CMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -D HORDE3D_BUILD_TESTS=Yes `
            -D HORDE3D_BUILD_EXAMPLES=Yes `
            -D CMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=Yes `
            -D CMAKE_CXX_STANDARD=${{ matrix.config.cppstd }} ..
      - name: Build
        shell: pwsh
        run: |
          cd build
          cmake --build  . --parallel --config ${{ matrix.build_type }}


  mingw:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      matrix:
        sys: [ mingw64, ucrt64 ]
    steps:
      - name: Set timezone
        run: tzutil /s "FLE Standard Time"
        shell: cmd
      - uses: msys2/setup-msys2@40677d36a502eb2cf0fb808cc9dec31bf6152638 # v2.28.0
        with:
          release: false
          msystem: ${{matrix.sys}}
          pacboy: cc:p cmake:p ninja:p lld:p
      - uses: actions/checkout@d632683dd7b4114ad314bca15554477dd762a938 # v4.2.0
      - name: Configure
        run: |
          cmake -B ../build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DHORDE3D_BUILD_TESTS=Yes \
            -DHORDE3D_BUILD_EXAMPLES=Yes \
            -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=Yes \
            -DCMAKE_CXX_STANDARD=${{ matrix.config.cppstd }}
        env: { LDFLAGS: -fuse-ld=lld }
      - name: Build
        run: cmake --build ../build
